<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-brand">
                <span class="nav-icon">✓</span>
                <h2>TaskFlow</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active">All Tasks</a></li>
                <li><a href="#" class="nav-link">About</a></li>
            </ul>
            <button id="clearBtn" class="nav-btn">Clear Completed</button>
        </div>
    </nav>

    <div class="container">
        <div class="todo-app">
            <h1>My Todo List</h1>
            
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..." 
                    class="todo-input"
                >
                <button id="addBtn" class="add-btn">Add</button>
            </div>

            <ul id="todoList" class="todo-list">
                <!-- Todos will be added here -->
            </ul>

            <div class="stats">
                <span id="totalTodos">Total: 0</span>
                <span id="completedTodos">Completed: 0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
